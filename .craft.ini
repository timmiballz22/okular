[BlueprintSettings]
; Produce a standalone, native Windows executable / NSIS installer (okular.exe)
; instead of a Windows Store .appx bundle.
; The official KDE build ships through the Microsoft Store and therefore sets
; this to True; for this fork we want a directly-runnable .exe, so it is off.
kde/applications/okular.packageAppx = False
